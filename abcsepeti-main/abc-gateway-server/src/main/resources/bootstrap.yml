spring:
  application:
    name: abc-gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker-postgresql}

management:
  endpoints:
    web:
      exposure:
        include: hystrix.stream
---

spring:
  profiles: local
  cloud:
    bus:
      enabled: false
    consul:
      enabled: false #consul discovery set false, in this profile eureka discovery is enabled.

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_FULL_URL:http://localhost:8761/eureka/}
    registerWithEureka: true
    enabled: true #eureka discovery is enabled in this profile
  instance:
    prefer-ip-address: false

management:
  metrics:
    export:
      influx:
        enabled: false #influx metrics not pushing in this profile

---

spring:
  profiles: docker-postgresql
  cloud:
    consul:
      host: abc-consul-discovery
      port: 8500
      discovery:
        instanceId: ${spring.application.name}:${random.value}
      enabled: false #consul discovery is enabled in this profile
    gateway:
      globalcors:
        - corsConfigurations['[/**]'].allowedOrigins=http://localhost:3000
        - corsConfigurations['[/**]'].allowedHeaders=*
        - corsConfigurations['[/**]'].allowedMethods[0]=GET
        - corsConfigurations['[/**]'].allowedMethods[1]=POST
---
spring:
  profiles: postgresql
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_IN_PORT:8500}
      discovery:
        health-check-path: /actuator/health
        health-check-interval: 10s
        instanceId: ${spring.application.name}:${random.value}

      enabled: true #consul discovery is enabled in this profile

management:
  metrics:
    export:
      statsd:
        enabled: true
        flavor: telegraf
        port: 8125
      influx: #pushing influx metrics.
        db: abc_influxdb_monitoring_metrics
        uri: ${INFLUXDB_FULL_URL:http://abc-influxdb:8086}
        auto-create-db: true
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    enabled: false #eureka discovery set false, in this profile consul discovery is enabled.